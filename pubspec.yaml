name: jin_gaming_hub
description: All-in-One Multi-Game Portal — Native gaming experience with modular architecture.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  cloud_firestore: ^4.14.0
  google_sign_in: ^6.1.6

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # UI & Animations
  flutter_carousel_slider: ^1.0.9
  cached_network_image: ^3.3.0
  shimmer: ^3.0.0
  flutter_animate: ^4.3.0
  lottie: ^2.7.0

  # Utils
  connectivity_plus: ^5.0.2
  share_plus: ^7.2.1
  path_provider: ^2.1.2
  intl: ^0.19.0

  # Game Engine (Flame)
  flame: ^1.8.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1
  hive_generator: ^2.0.1
  build_runner: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
