name: jin_gaming_hub
description: All-in-One Multi-Game Portal — Native gaming experience with modular architecture.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # Firebase
  firebase_core: ^3.1.1
  firebase_auth: ^5.1.1
  cloud_firestore: ^5.0.2
  google_sign_in: ^6.2.1

  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utils
  connectivity_plus: ^6.0.3
  share_plus: ^9.0.0
  path_provider: ^2.1.4
  intl: ^0.19.0

  # Game Engine (Flame)
  flame: ^1.18.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
