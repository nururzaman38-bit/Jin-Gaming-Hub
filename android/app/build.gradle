def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withReader('UTF-8') { reader ->
        localProperties.load(reader)
    }
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    // Fallback: try to find Flutter SDK from environment
    flutterRoot = System.env.FLUTTER_ROOT ?: null
}
if (flutterRoot == null) {
    // Fallback: try to find Flutter SDK from PATH
    def flutterExe = "flutter"
    try {
        def proc = ["which", "flutter"].execute()
        proc.waitFor()
        if (proc.exitValue() == 0) {
            def flutterPath = proc.text.trim()
            // flutter binary is at SDK_ROOT/bin/flutter, so go up two dirs
            flutterRoot = new File(flutterPath).parentFile.parent
        }
    } catch (Exception ignored) {}
}
if (flutterRoot == null) {
    throw new GradleException("""
    ======================================================================
    Flutter SDK not found. Please do one of:
    1. Set flutter.sdk in android/local.properties
    2. Set FLUTTER_ROOT environment variable
    3. Add Flutter to your PATH
    ======================================================================
    """)
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode') ?: '1'
def flutterVersionName = localProperties.getProperty('flutter.versionName') ?: '1.0.0'

apply plugin: 'com.android.application'
apply plugin: 'kotlin-android'
apply plugin: 'com.google.gms.google-services'
apply from: "${flutterRoot}/packages/flutter_tools/gradle/flutter.gradle"

android {
    namespace "com.jin.gaminghub"
    compileSdk 34

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = '1.8'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.jin.gaminghub"
        minSdk 23
        targetSdk 34
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation platform('com.google.firebase:firebase-bom:32.7.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-firestore'
}
